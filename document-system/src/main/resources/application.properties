# Independent business runtime. Scoped RBAC key and H2 password come only from ignored local config.
spring.application.name=municipal-documents
spring.config.import=optional:file:../.local/office-local.properties
server.address=127.0.0.1
server.port=9090
server.servlet.session.cookie.name=OFFICE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
office.rbac-url=http://127.0.0.1:8080/api/authorization/check
office.app-key=
office.mock.editor-id=0
office.mock.reader-id=0
