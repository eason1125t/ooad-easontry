# Runtime configuration; credentials are loaded only from the ignored local file.
spring.application.name=municipal-access
spring.config.import=optional:file:../.local/application-local.properties,optional:file:.local/application-local.properties
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/municipal_access_ooad_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:municipal_ooad_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.flyway.user=${MIGRATION_USER:municipal_ooad_migrator}
spring.flyway.password=${MIGRATION_PASSWORD:}
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
app.cookie-secure=false
app.session-seconds=1800
# User-selected local course demo policy; raise this before any deployment.
app.password-min-length=4
app.bootstrap-file=../.local/bootstrap.json
